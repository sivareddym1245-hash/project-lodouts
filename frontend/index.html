<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Loadout Locker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #f1f1f1; }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; color: #ff8c00; }
        form { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #ff8c00; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background-color: #e67e00; }
        .loadout-card { background: #1e1e1e; padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid #ff8c00; }
        .loadout-card h3 { margin-top: 0; color: #ff8c00; }
        .actions { margin-top: 10px; display: flex; gap: 10px; }
        .actions button { width: auto; padding: 8px 15px; }
        .actions button.edit { background-color: #4CAF50; }
        .actions button.delete { background-color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FF Loadout Locker</h1>
        
        <!-- CREATE / UPDATE FORM -->
        <form id="loadoutForm">
            <input type="hidden" id="loadoutId">
            <input type="text" id="gameMode" placeholder="Game Mode (e.g. Clash Squad - Ranked)" required>
            <input type="text" id="activeSkill" placeholder="Active Skill (e.g. Alok)" required>
            <input type="text" id="passive1" placeholder="Passive Skill 1" required>
            <input type="text" id="passive2" placeholder="Passive Skill 2" required>
            <input type="text" id="passive3" placeholder="Passive Skill 3" required>
            <button type="submit" id="submitBtn">Save Loadout</button>
        </form>

        <!-- READ LIST -->
        <div id="loadoutsList">
            <p>Loading loadouts...</p>
        </div>
    </div>

    <script>
        // NOTE: Change this to your Render URL before deploying to Netlify!
        const API_URL = 'https://project-lodouts.onrender.com/loadouts';

        // 1. READ: Fetch and display loadouts
        async function fetchLoadouts() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const list = document.getElementById('loadoutsList');
                list.innerHTML = '';
                
                if (data.length === 0) {
                    list.innerHTML = '<p>No loadouts saved yet. Add one above!</p>';
                    return;
                }

                data.forEach(loadout => {
                    list.innerHTML += `
                        <div class="loadout-card">
                            <h3>${loadout.game_mode}</h3>
                            <p><strong>Active:</strong> ${loadout.active_skill}</p>
                            <p><strong>Passives:</strong> ${loadout.passive_1} | ${loadout.passive_2} | ${loadout.passive_3}</p>
                            <div class="actions">
                                <button class="edit" onclick="editLoadout(${loadout.id}, '${loadout.game_mode}', '${loadout.active_skill}', '${loadout.passive_1}', '${loadout.passive_2}', '${loadout.passive_3}')">Edit</button>
                                <button class="delete" onclick="deleteLoadout(${loadout.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('loadoutsList').innerHTML = '<p style="color: red;">Error connecting to the backend. Is server.js running?</p>';
            }
        }

        // 2. CREATE or UPDATE: Handle form submission
        document.getElementById('loadoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('loadoutId').value;
            const loadoutData = {
                game_mode: document.getElementById('gameMode').value,
                active_skill: document.getElementById('activeSkill').value,
                passive_1: document.getElementById('passive1').value,
                passive_2: document.getElementById('passive2').value,
                passive_3: document.getElementById('passive3').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loadoutData)
            });

            // Reset form and refresh list
            document.getElementById('loadoutForm').reset();
            document.getElementById('loadoutId').value = '';
            document.getElementById('submitBtn').innerText = 'Save Loadout';
            fetchLoadouts();
        });

        // 3. DELETE: Remove a loadout
        async function deleteLoadout(id) {
            if(confirm('Are you sure you want to delete this loadout?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchLoadouts();
            }
        }

        // 4. Populate form to trigger PUT instead of POST
        function editLoadout(id, mode, active, p1, p2, p3) {
            document.getElementById('loadoutId').value = id;
            document.getElementById('gameMode').value = mode;
            document.getElementById('activeSkill').value = active;
            document.getElementById('passive1').value = p1;
            document.getElementById('passive2').value = p2;
            document.getElementById('passive3').value = p3;
            document.getElementById('submitBtn').innerText = 'Update Loadout';
            window.scrollTo(0, 0);
        }

        // Load data when page opens
        fetchLoadouts();
    </script>
</body>
</html>
